services:
  - type: web
    name: arcadepalomuchacho
    runtime: node
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: FRONTEND_URL
        value: https://wilmerf17.github.io,https://arcadepalomuchacho.vercel.app
